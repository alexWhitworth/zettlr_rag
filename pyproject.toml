[project]
name = "zettlr-rag"
version = "0.9.0"
description = "RAG or LLM Knowledge for my papers library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llama-index-llms-google-genai",
    "llama-index-embeddings-google-genai",
    "llama-index-vector-stores-chroma",
    "llama-index-retrievers-bm25",
    "rank-bm25",
    "chromadb",
    "python-frontmatter",
    "python-dotenv",
    "pandas",
    "nest-asyncio",
    "langfuse>=3.0.0",
    "openinference-instrumentation-llama-index>=0.3.0",
    "opentelemetry-sdk>=1.24.0",
    "numpy",
    "scikit-learn",
]
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
evals = [
    "pandas>=2.0.0",
    "scipy>=1.13.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "black",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "C4",  # flake8-comprehensions (cleaner comprehensions)
    "UP",  # pyupgrade (modernize Python syntax)
    "N",   # pep8-naming (naming conventions)
    "RUF", # Ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=zettlr_rag --cov=evals.reliability_harness --cov=evals.llm_judge --cov-report=xml --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/zettlr_rag", "evals/reliability_harness.py", "evals/llm_judge.py"]
omit = [
    "tests/*",
    "**/__init__.py"
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
